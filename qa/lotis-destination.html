<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка перехода в кабинет</title></head><body>
<h1>Переход в клиентское приложение</h1><p>Локальная проверка адресов. Заявка не создаётся.</p><dl id="result"></dl>
<script>
const target = document.getElementById('result');
for (const [name,value] of new URLSearchParams(location.search)) {
  const key = document.createElement('dt'); key.textContent = name;
  const term = document.createElement('dd'); term.textContent = value;
  target.append(key,term);
}
document.body.dataset.hash = location.hash;
</script></body></html>
