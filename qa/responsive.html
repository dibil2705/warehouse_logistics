<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive QA</title><style>body{margin:0;background:#ddd;font:12px Arial;display:flex;gap:16px;align-items:flex-start}section{flex-shrink:0}p{height:22px;margin:8px}iframe{display:block;border:0;background:#f7f7f2}#report{position:fixed;bottom:0;left:0;background:#fff;padding:10px;font-size:10px;z-index:5;max-width:100vw}</style><section><p>390 px / mobile</p><iframe title="Mobile 390" src="../index.html" width="390" height="844"></iframe></section><section><p>768 px / tablet</p><iframe title="Tablet 768" src="../index.html" width="768" height="1024"></iframe></section><output id="report"></output><script>const frames=[...document.querySelectorAll('iframe')];function report(){document.getElementById('report').textContent=frames.map(f=>{const d=f.contentDocument;if(!d)return 'loading';const ids=[...d.querySelectorAll('[id]')].map(x=>x.id);return JSON.stringify({width:f.width,contentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>+f.width,h1:d.querySelectorAll('h1').length,duplicateIds:ids.filter((id,i)=>ids.indexOf(id)!==i),missingAnchors:[...d.querySelectorAll('a[href^="#"]')].filter(a=>!d.getElementById(a.hash.slice(1))).length})}).join(' | ')}frames.forEach(f=>f.addEventListener('load',report));</script></html>
